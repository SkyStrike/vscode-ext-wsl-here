name: Auto Versioning & Tagging

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Bump Version and Create Tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 1.0.0
          WITH_V: true

      - name: Update package.json Version & Package VSIX
        run: |
          # Strip leading 'v' from new tag if present (e.g. v1.0.0 -> 1.0.0)
          CLEAN_VERSION="${NEW_TAG#v}"
          echo "Updating version to $CLEAN_VERSION"
          npm version --no-git-tag-version $CLEAN_VERSION

          npm install -g @vscode/vsce
          vsce package --out "wsl-here-${CLEAN_VERSION}.vsix" --allow-missing-repository
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}